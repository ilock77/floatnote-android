name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek isi repo
        run: |
          ls -la
          ls -la app || true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Tampilkan error
        if: failure()
        run: |
          {
            echo '### Error Gradle'
            echo '```'
            grep -E -B1 -A12 'What went wrong|^e: |error:' build.log | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          msg=$(grep -E -A8 'What went wrong|^e: ' build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle gagal::$msg"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FloatNote-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build.log
